<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Library - Odin Project</h1>

    <div class = "library-container" id = "library-cont">
    </div>

    <form class = "input-container" id = "form">
        <input id = "name-input" type = "text" placeholder = "Book name goes here..."></input>
        <input id = "author-input" type = "text" placeholder = "Book author goes here..."></input>
        <input id = "pages-input" type = "text" placeholder = "Book pages goes here..."></input>
        <select id = "isRead-input">
            <option id = "isRead-yes">Yes</option>
            <option id = "isRead-no">No</option>
        </select>
        <button id = "submit-btn" type = "submit">Submit</button>
    </form>

    <div class = "button-container">
        <button id = "add-btn">Add new book</button>
        <button id = "read-status-btn">Change read status</button>
    </div>
    <script src = "index.js" defer></script>
</body>
</html>
